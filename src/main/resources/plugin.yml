name: zMItemsBuilder
version: ${project.version}
main: dev.zm.itemsbuilder.zMItemsBuilder
api-version: "1.20"
author: zMarkitos_
description: Create and automate custom items, sets and scalable progression with ease.

commands:
  zmitemsbuilder:
    description: Main command for zMItemsBuilder.
    usage: /zmitems <create|reload|material|info|lore|enchant|rename|migrate|item>
    aliases: [zmitems, zmib]
    permission: zmitemsbuilder.use
  irename:
    description: Rename the held item.
    usage: /rename <new_name>
    aliases: [rename]
    permission: zmitemsbuilder.rename
permissions:
  zmitemsbuilder.use:
    description: Allows base zMItemsBuilder command usage.
    default: true
  zmitemsbuilder.create:
    description: Allows creating items.
    default: op
  zmitemsbuilder.reload:
    description: Allows reloading zMItemsBuilder.
    default: op
  zmitemsbuilder.material:
    description: Allows changing the held item's material.
    default: op
  zmitemsbuilder.info:
    description: Allows viewing held item info.
    default: true
  zmitemsbuilder.update:
    description: Allows receiving update notifications.
    default: op
  zmitemsbuilder.lore:
    description: Allows editing the lore of held items.
    default: op
  zmitemsbuilder.enchant:
    description: Allows editing enchantments of held items.
    default: op
  zmitemsbuilder.rename:
    description: Allows renaming the held item.
    default: op
  zmitemsbuilder.migrate:
    description: Allows migrating legacy custom items.
    default: op
  zmitemsbuilder.item:
    description: Allows managing saved items (save/show/give/remove).
    default: op
