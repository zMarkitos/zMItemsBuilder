# ==========================================================
#  zMItemsBuilder — Items Configuration
# ==========================================================
#
#  This file defines every custom item, group, rarity and
#  visual template used by zMItemsBuilder.
#
#  Items are loaded automatically when the server starts
#  and whenever the plugin is reloaded.
#
#  Documentation & syntax reference:
#    https://zmarkitos.gitbook.io/zmitemsbuilder
#
# ==========================================================

# Internal version (DO NOT MODIFY)
items-version: 1

raritys:
  special: "★★★&7★★"
  objects: "★★★★&7★"
  levels: ""

esthetic:
  name-template: "&f{item_type} &8▸ {prefix_item}"
  enchant-format: "   {primary_color}• &f{enchant_name} {secondary_color}{level}"
  lore-template:
    - "&7"
    - " {primary_color}&l🕮&r {primary_color}Enchantments:"
    - "{enchants}"
    - "&7"
    - " {primary_color}⌛ &fRarity: {primary_color}{rarity}"
    - "&7"

heads-texture:
  special: "eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZWFlZDUyYTA0ZWRmYzQyOTU5MGMyMWQ1OWQ1MDA1ZTNiYTYyODY2YzUyYWVkODk1ZjFiZTk0ZDdmNjQyYTAxMyJ9fX0="
  level_1: ""

items:
  special_head:
    mode: single
    material: PLAYER_HEAD
    display-type: "Casco"
    name: "&f{item_type} &8▸ {prefix_item}"
    lore:
      - ""
      - " {gradient:🕮 Enchantments:}"
      - "{enchants}"
      - ""
      - " {gradient:⚡ Abilities:}"
      - "   {primary_color}&l•&r &fExtra hearts {secondary_color}+{attribute_level:max_health}"
      - "   {primary_color}&l•&r &fSpeed level {secondary_color}+{attribute_level:speed}"
      - ""
      - " {gradient:⌛ Rarity:} {secondary_color}{rarity}"
      - ""
      - " {primary_color}₪ &fObtain this by buying"
      - " &fit at {secondary_color}store.servername.net&f."
    enchants:
      protection: 10
      unbreaking: 5
      mending: 5
    item-flags:
      - HIDE_ENCHANTS
      - HIDE_ALL
    behavior-flags:
      - NO_PLACE
    attributes:
      armor:
        attribute: ARMOR
        amount: 3
        operation: ADD_NUMBER
        slot: HELMET
      max_health:
        attribute: MAX_HEALTH
        amount:
          base: 10.0
          per-level: 2.0
          max: 30.0
        operation: ADD_NUMBER
        slot: HELMET
      speed:
        attribute: MOVEMENT_SPEED
        amount:
          base: 0.02
          per-level: 0.01
          max: 0.05
        operation: ADD_NUMBER
        slot: HELMET

