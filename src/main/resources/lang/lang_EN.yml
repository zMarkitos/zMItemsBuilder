  progression-input-max: "<newline><bold><aqua>▸ MAXIMUM LIMIT</aqua></bold><newline><gray>Optional: the value will never exceed this limit.</gray><newline><gray>If you don't want to set a cap, type </gray><yellow>skip</yellow><gray>.</gray><newline><newline><dark_gray>▸ Type </dark_gray><red>cancel</red><dark_gray> to exit.</dark_gray>"
