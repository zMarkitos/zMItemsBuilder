  # =====================================================
  usage-create: "&eUsage: /zmitems create <name>"
  kit-not-found: "&cThe group &f{kit} &cdoes not exist."
  invalid-hex-prefix: "&cYou must include a valid hex color. Example: &f/zmitems give GROUP player mikit &#FF0000"
  success: "&aGroup &f{kit} &adelivered successfully. Items: &f{count}&a, dropped: &f{dropped}&a."
  create-gui-name-exists: "&cAn item with the id &f{name} &calready exists. check &eitems.yml&c."
  give-item-not-found: "&cThe item &f{item} &cdoes not exist in items.yml."
  player-not-found: "&cPlayer not found: &f{player}"
  give-success: "&aDelivered item &f{item} &a(x{amount}) to &f{player}&a."
  give-success-group: "&aDelivered group &f{group} &ato &f{player}&a."
  usage-give: "&eUsage: /zmitems give <NORMAL|GROUP> <player> <id> [amount|prefix]"

