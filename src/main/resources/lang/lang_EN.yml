# =====================================================
# zMItemsBuilder - Language file (EN)
# =====================================================
# - Supports Minecraft color codes using "&" (e.g. &a, &c, &7)
# - Supports HEX colors: &#RRGGBB
# - Supports MiniMessage format: <gradient>, <bold>, <click>, <hover>, etc.

version: 6

messages:
  prefix: '<b><gradient:#F13713:#C14C36:#F13713>zMItemsBuilder</gradient></b> &8| &r'

  # =====================================================
  # GENERAL MESSAGES
  # =====================================================
  no-permission: "&cYou don't have permission to do that."
  player-only: "&cOnly players can execute this command."
  no-item-in-hand: "&cYou don't have an item in your hand."
  reloaded: "&aConfiguration reloaded successfully."

  # =====================================================
  # COMMANDS: HELP
  # =====================================================
  help-lines:
    - ""
    - "<b><gradient:#F13713:#C14C36:#F13713>zMItemsBuilder</gradient></b> &8| &r&eCommands"
    - ""
    - " &f/zmitems create &7<name> &8— &7Creates an item group with the given color."
    - " &f/zmitems material &7<material> &8— &7Changes the material of the item in hand."
    - " &f/zmitems rename &7<name> &8— &7Changes or removes the custom name of the item in hand."
    - " &f/zmitems enchant &7<enchantment> <level> &8— &7Adds or removes an enchantment (0 = remove)."
    - " &f/zmitems lore &7<add|remove|set|reset|copy|paste> &8— &7Edits the lore of the item in hand."
    - " &f/zmitems info &8— &7Shows the ID and custom model data of the item in hand."
    - " &f/zmitems item &7<save|show|give|remove|update> &8— &7Manages saved item snapshots."
    - " &f/zmitems clone &7<name> [group] &8— &7Clones the item in hand to items.yml."
    - " &f/zmitems action &7<add|remove> <itemId> &8— &7Adds or removes click actions for an item."
    - "  &8  &7types: &fplayer_command&7, &fconsole_command&7, &fsound&7, &fuses&7, &fcooldown"
    - " &f/zmitems effect &7<add|remove|list> &8— &7Manages potion effects of an item."
    - " &f/zmitems migrate &8— &7Updates old items to the new format."
    - " &f/zmitems glow &8— &7Toggles the enchantment glint."
    - " &f/zmitems hide &7<flag> &8— &7Toggles an item flag."
    - " &f/zmitems flag &7<flag> &8— &7Toggles a behavior flag."
    - " &f/zmitems progression &7[enchant|attribute] [item] &8— &7Configures progression rules."
    - " &f/zmitems attribute &7<add|remove> &8— &7Adds or removes attributes on an item."
    - " &f/zmitems unbreakable &8— &7Toggles the unbreakable state."
    - " &f/zmitems armor_trim &7<material> <pattern> &8— &7Applies or removes an armor trim."
    - " &f/zmitems reload &8— &7Reloads configuration and language files."
    - ""

  # =====================================================
