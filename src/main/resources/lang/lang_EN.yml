  progression-input-bonus: "<newline><bold><yellow>▸ BONUS VALUE</yellow></bold><newline><gray>How much should be added per interval?</gray><newline><gray>Example: </gray><yellow>every = 3</yellow><gray> + </gray><yellow>bonus = 2</yellow><gray> → levels 3-5 add 2, 6-8 add 4...</gray><newline><newline><dark_gray>▸ Type </dark_gray><red>cancel</red><dark_gray> to exit.</dark_gray>"
