# =====================================================
# zMItemsBuilder - Archivo de idioma (ES)
# =====================================================
# - Soporta códigos de color de Minecraft usando "&" (ej: &a, &c, &7)
# - Soporta colores HEX: &#RRGGBB
# - Soporta formato MiniMessage: <gradient>, <bold>, <click>, <hover>, etc.

version: 6

messages:
  prefix: '<b><gradient:#F13713:#C14C36:#F13713>zMItemsBuilder</gradient></b> &8| &r'

  # =====================================================
  # MENSAJES GENERALES
  # =====================================================
  no-permission: "&cNo tienes permiso para hacer esto."
  player-only: "&cSolo un jugador puede ejecutar este comando."
  no-item-in-hand: "&cNo tienes ningún item en la mano."
  reloaded: "&aConfiguración recargada correctamente."

  # =====================================================
  # COMANDOS: HELP
  # =====================================================
  help-lines:
    - ""
    - "<b><gradient:#F13713:#C14C36:#F13713>zMItemsBuilder</gradient></b> &8| &r&eComandos"
    - ""
    - " &f/zmitems create &7<nombre> &8— &7Crea un grupo de items con el color indicado."
    - " &f/zmitems material &7<material> &8— &7Cambia el material del item en mano."
    - " &f/zmitems rename &7<nombre> &8— &7Cambia o elimina el nombre del item en mano."
    - " &f/zmitems enchant &7<encanto> <nivel> &8— &7Agrega o elimina un encanto (0 = eliminar)."
    - " &f/zmitems lore &7<add|remove|set|reset|copy|paste> &8— &7Edita el lore del item en mano."
    - " &f/zmitems info &8— &7Muestra el ID y model data del item en mano."
    - " &f/zmitems item &7<save|show|give|remove|update> &8— &7Gestiona snapshots de items guardados."
    - " &f/zmitems clone &7<nombre> [grupo] &8— &7Clona el item en mano a items.yml."
    - " &f/zmitems action &7<add|remove> <itemId> &8— &7Agrega o elimina acciones de click en un item."
    - "  &8  &7tipos: &fplayer_command&7, &fconsole_command&7, &fsound&7, &fuses&7, &fcooldown"
    - " &f/zmitems effect &7<add|remove|list> &8— &7Gestiona efectos de poción de un ítem."
    - " &f/zmitems migrate &8— &7Actualiza items viejos al nuevo formato."
    - " &f/zmitems glow &8— &7Activa/desactiva el brillo de encantamiento."
    - " &f/zmitems hide &7<flag> &8— &7Activa/desactiva una flag de item."
    - " &f/zmitems flag &7<flag> &8— &7Activa/desactiva una flag de comportamiento."
    - " &f/zmitems progression &7[enchant|attribute] [item] &8— &7Configura reglas de progresión."
    - " &f/zmitems attribute &7<add|remove> &8— &7Agrega o elimina atributos en un ítem."
    - " &f/zmitems unbreakable &8— &7Activa/desactiva el estado irrompible."
    - " &f/zmitems armor_trim &7<material> <patrón> &8— &7Aplica o elimina una trim de armadura."
    - " &f/zmitems reload &8— &7Recarga la configuración y los archivos de idioma."
    - ""

