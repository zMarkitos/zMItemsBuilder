  # COMANDOS: CREATE
  # =====================================================
  usage-create: "&eUso: /zmitems create <nombre>"
  kit-not-found: "&cEl grupo &f{kit} &cno existe."
  invalid-hex-prefix: "&cDebes incluir un color hex válido. Ejemplo: &f/zmitems give GROUP player mikit &#FF0000"
  success: "&aGrupo &f{kit} &aentregado correctamente. Objetos: &f{count}&a, soltados: &f{dropped}&a."
  create-gui-name-exists: "&cYa existe un item con el id &f{name}&c. revisa &eitems.yml&c."
  give-item-not-found: "&cEl item &f{item} &cno existe en items.yml."
  player-not-found: "&cJugador no encontrado: &f{player}"
  give-success: "&aSe ha entregado el item &f{item} &a(x{amount}) a &f{player}&a."
  give-success-group: "&aSe ha entregado el grupo &f{group} &aa &f{player}&a."
  usage-give: "&eUso: /zmitems give <NORMAL|GROUP> <player> <id> [cantidad|prefijo, color hex]"

